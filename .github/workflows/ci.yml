name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app --select E9,F
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proposal
          POSTGRES_PASSWORD: proposal
          POSTGRES_DB: proposal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proposal -d proposal"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://proposal:proposal@localhost:5432/proposal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8106
      NEXT_PUBLIC_APP_ENV: local-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: npm ci
        working-directory: app/web
      - run: npx playwright install --with-deps chromium
        working-directory: app/web
      - run: uv run playwright install chromium
      - run: npm run build
        working-directory: app/web
      - run: npm run e2e
        working-directory: app/web

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag proposal-api:ci .
      - name: Start seeded fixture container
        run: >-
          docker run --detach --name proposal-api --publish 8106:8106
          --env APP_ENV=local-fixture
          --env DATABASE_URL=sqlite+pysqlite:////tmp/showcase.db
          --env STORAGE_DIR=/tmp/documents
          proposal-api:ci
          sh -c "uv run --no-sync python -m app.cli reset && exec uv run --no-sync uvicorn app.api.main:app --host 0.0.0.0 --port 8106"
      - name: Verify container boot
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8106/health && exit 0
            sleep 1
          done
          docker logs proposal-api
          exit 1
      - if: always()
        run: docker rm --force proposal-api
